info:
  name: List sessions
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/auth/sessions"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("lists the register and login sessions", () => {
          expect(res.status).to.equal(200);
          expect(res.body).to.be.an("array").with.length.of.at.least(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
