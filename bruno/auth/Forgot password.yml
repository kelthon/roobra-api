info:
  name: Forgot password
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("answers the same whether or not the email exists", () => {
          expect(res.status).to.equal(201);
          expect(res.body.data.message).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
