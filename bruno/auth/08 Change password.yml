info:
  name: Change password
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/change-password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{password}}",
        "newPassword": "{{newPassword}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("newPassword", "Changed456!");
    - type: after-response
      code: |-
        // The next requests sign in with the new password
        if (res.status === 201) {
          bru.setVar("password", bru.getVar("newPassword"));
        }
    - type: tests
      code: |-
        test("changes the password", () => {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
