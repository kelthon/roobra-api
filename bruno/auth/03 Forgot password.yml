info:
  name: Forgot password
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
