info:
  name: Reset password
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "resetToken": "{{resetToken}}",
        "newPassword": "{{newPassword}}",
        "confirmNewPassword": "{{newPassword}}"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("newPassword", "Reset789!");
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("password", bru.getVar("newPassword"));
        }
    - type: tests
      code: |-
        test("sets the new password", () => {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
