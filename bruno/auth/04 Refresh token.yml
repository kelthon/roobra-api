info:
  name: Refresh token
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/refresh-token"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("previousRefreshToken", bru.getVar("refreshToken"));
    - type: after-response
      code: |-
        bru.setVar("accessToken", res.body.data.accessToken);
        bru.setVar("refreshToken", res.body.data.refreshToken);
    - type: tests
      code: |-
        test("rotates the refresh token", () => {
          expect(res.status).to.equal(201);
          expect(res.body.data.refreshToken).to.not.equal(bru.getVar("previousRefreshToken"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
