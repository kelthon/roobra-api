info:
  name: Logout from every session
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/logout/all"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("revokes the other sessions", () => {
          expect(res.status).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
