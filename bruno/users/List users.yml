info:
  name: List users
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/v1/users"
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("answers the first page, newest first, with its meta", () => {
          expect(res.status).to.equal(200);
          expect(res.body.data).to.be.an("array").with.length.of.at.most(10);
          expect(res.body.meta).to.include({ paginationType: "page", page: 1, limit: 10 });
          expect(res.body.meta.totalItems).to.be.a("number");
          expect(res.body.meta).to.not.have.property("previousPageURI");
        });

        test("sorts by createdAt, newest first", () => {
          const dates = res.body.data.map((user) => user.createdAt);
          expect(dates).to.deep.equal([...dates].sort().reverse());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
