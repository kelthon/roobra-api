info:
  name: List users with an invalid query
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/v1/users?limit=101&orderBy=hashedPassword:asc&cursor=abc"
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("answers validation-failed", () => {
          expect(res.status).to.equal(400);
          expect(res.body.type).to.equal("https://api.roobra.com/problems/validation-failed");
        });

        test("lists every invalid parameter", () => {
          const fields = res.body.errors.map((error) => error.field);
          expect(fields).to.include.members(["limit", "orderBy", "cursor"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
