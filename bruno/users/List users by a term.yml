info:
  name: List users by a term
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/v1/users?term=ADMIN"
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("keeps the users whose username or email contains the term, in any case", () => {
          expect(res.status).to.equal(200);
          expect(res.body.data.length).to.be.at.least(1);

          for (const user of res.body.data) {
            const found = `${user.username} ${user.email}`.toLowerCase();
            expect(found).to.include("admin");
          }
        });

        test("counts only the matching users", () => {
          if (res.body.meta.totalPages === 1) {
            expect(res.body.meta.totalItems).to.equal(res.body.data.length);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
