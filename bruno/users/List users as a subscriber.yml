info:
  name: List users as a subscriber
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/v1/users"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("forbids a subscriber", () => {
          expect(res.status).to.equal(403);
          expect(res.body.type).to.equal("about:blank");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
