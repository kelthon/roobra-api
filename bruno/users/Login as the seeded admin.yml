info:
  name: Login as the seeded admin
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@roobra.test",
        "password": "{{seedPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("adminAccessToken", res.body.data.accessToken);
    - type: tests
      code: |-
        test("signs in as the admin of the seed", () => {
          expect(res.status).to.equal(201);
          expect(res.body.data.user.email).to.equal("admin@roobra.test");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
