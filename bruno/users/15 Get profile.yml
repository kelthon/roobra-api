info:
  name: Get profile
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/v1/users/me"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the profile, verified", () => {
          expect(res.status).to.equal(200);
          expect(res.body.email).to.equal(bru.getVar("email"));
          expect(res.body.emailVerifiedAt).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
