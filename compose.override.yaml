# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

name: roobra-api
services:
  server:
    build:
      target: build
    restart: unless-stopped
    # Your user and group ids, so files written into the bind mount stay yours (HOST_UID and
    # HOST_GID in .env; 1000 is the first user on most Linux machines).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      NODE_ENV: development
    # The bind mount below replaces /usr/src/app with the host repo at container start,
    # hiding the Prisma client generated into the image at build time (src/generated/prisma
    # is gitignored, so it's normally absent on the host). Regenerating it here makes dev
    # self-healing instead of depending on a developer having run `prisma generate` on the
    # host beforehand.
    command: sh -c "npx prisma generate && npm run start:dev"
    volumes:
      - ".:/usr/src/app"
      - "/usr/src/app/node_modules"
    # `start:dev` keeps the TypeScript compiler in memory next to the app; the 512M of
    # compose.yaml is sized for running dist/ only.
    deploy:
      resources:
        limits:
          memory: 1G

  # Published to the host only in dev (this file is never loaded in prod), so tools like
  # DBeaver/psql can connect via DATABASE_HOST/DATABASE_PORT from .env. The app itself keeps
  # using DATABASE_URL's `postgres:5432` (the Compose service name) from compose.yaml.
  postgres:
    ports:
      - "${DATABASE_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Catches every email the app sends in dev; nothing leaves the machine. Read them at
  # http://localhost:8025. The app reaches it at mailpit:1025 from its container, or
  # localhost:1025 when it runs on the host. Any EMAIL_USER and EMAIL_PASSWORD are accepted.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
