name: "Setup node dependencies"
description: "Checks out the repository, sets up Node.js, and installs dependencies via npm ci"

runs:
  using: "composite"
  steps:
    - name: "Checkout repository"
      uses: actions/checkout@v6

    - name: "Set up Node.js"
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: "npm"

    - name: "Install dependencies"
      run: npm ci
      shell: bash
