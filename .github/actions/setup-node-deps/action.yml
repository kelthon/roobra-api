name: "Setup node dependencies"
# The workflow checks out the repository before calling this action: GitHub reads a local action
# from the workspace, so it cannot be the one to check it out.
description: "Sets up Node.js, installs dependencies via npm ci and generates the Prisma client"

runs:
  using: "composite"
  steps:
    - name: "Set up Node.js"
      uses: actions/setup-node@v7
      with:
        node-version: "24.21"
        cache: "npm"

    - name: "Install dependencies"
      run: npm ci
      shell: bash

    - name: "Generate prisma files"
      run: "npx prisma generate"
      shell: bash

